services:
  - type: web
    name: financial-crime-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
